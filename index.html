    <!-- Primary Meta Tags -->

    <meta name="title" content="Ordefy - Plataforma de E-commerce para Paraguay | Acceso Anticipado" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Ordefy - Plataforma de E-commerce para Paraguay" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ordefy.com/" />
    <meta property="twitter:title" content="Ordefy - Plataforma de E-commerce para Paraguay" />
    <meta property="twitter:description" content="Únete a la revolución del e-commerce en Paraguay. Solicita tu acceso anticipado a Ordefy." />
    <meta property="twitter:image" content="/favicon.svg" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="PY" />
    <meta name="geo.placename" content="Paraguay" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://ordefy.com/" />

    <!-- Premium Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      HTML preloader — only the animation keyframe and fade-out transition live here.
      ALL visual content uses inline style= attributes so they render in the very
      first browser paint, before any CSS bundle or JS is fetched.

      z-index strategy:
        • HTML preloader  → z-index: 50  (low — React components render on top)
        • LoadingScreen   → z-index: 9999 (renders ON TOP of HTML preloader, same bg)
        • When React mounts, main.tsx fades the HTML preloader while LoadingScreen
          covers it — zero visual gap.
    -->
    <style>
      @keyframes _pl-dot {
        0%, 100% { transform: scale(1);    opacity: 1;   }
        50%       { transform: scale(0.45); opacity: 0.3; }
      }
      #_html-preloader.fade-out {
        opacity: 0 !important;
        pointer-events: none;
        transition: opacity 0.4s ease !important;
      }
    </style>

  </head>
  <body style="background-color:#0a0a0f;margin:0;">

    <!--
      Instant preloader — painted by the browser before a single byte of JS loads.
      Every style is INLINE to guarantee visibility on the very first browser frame.
    -->
    <div id="_html-preloader" style="
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 1;
    ">
      <!-- Logo row: Layers icon + wordmark -->
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
          stroke="#B0ED54" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"
          xmlns="http://www.w3.org/2000/svg">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
        <span style="
          font-family: Inter, system-ui, -apple-system, sans-serif;
          font-size: 26px;
          font-weight: 600;
          color: #ffffff;
          letter-spacing: -0.5px;
          line-height: 1;
        ">ordefy</span>
      </div>

      <!-- Animated dots -->
      <div style="margin-top:36px;display:flex;gap:7px;">
        <span style="display:block;width:7px;height:7px;border-radius:50%;background:#B0ED54;animation:_pl-dot 1.4s ease-in-out infinite;"></span>
        <span style="display:block;width:7px;height:7px;border-radius:50%;background:#B0ED54;animation:_pl-dot 1.4s ease-in-out infinite;animation-delay:0.2s;"></span>
        <span style="display:block;width:7px;height:7px;border-radius:50%;background:#B0ED54;animation:_pl-dot 1.4s ease-in-out infinite;animation-delay:0.4s;"></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
