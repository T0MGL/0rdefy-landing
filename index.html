    <meta name="theme-color" content="#000000" />

    <link rel="canonical" href="https://ordefy.com/" />

    <!-- Premium Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Static preloader styles (shown instantly before JS loads) -->
    <style>
      #init-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: hsl(240, 10%, 4%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #init-loader .il-glow {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: rgba(186, 234, 89, 0.05);
        filter: blur(100px);
      }
      #init-loader .il-corner {
        position: absolute;
        width: 48px;
        height: 48px;
        border-color: rgba(255, 255, 255, 0.06);
        border-style: solid;
      }
      @keyframes il-spin {
        from { transform: rotate(-90deg); }
        to   { transform: rotate(270deg); }
      }
    </style>
  </head>
  <body style="background-color: hsl(240, 10%, 4%); margin: 0;">
    <!-- Static preloader: shown instantly before JS loads, removed instantly when React mounts -->
    <div id="init-loader">
      <div class="il-glow"></div>
      <div class="il-corner" style="top:32px;left:32px;border-width:1px 0 0 1px;"></div>
      <div class="il-corner" style="top:32px;right:32px;border-width:1px 1px 0 0;"></div>
      <div class="il-corner" style="bottom:32px;left:32px;border-width:0 0 1px 1px;"></div>
      <div class="il-corner" style="bottom:32px;right:32px;border-width:0 1px 1px 0;"></div>
      <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;">
        <div style="position:relative;width:80px;height:80px;">
          <!-- Background track -->
          <svg width="80" height="80" viewBox="0 0 80 80" style="display:block;position:absolute;inset:0;">
            <circle cx="40" cy="40" r="36" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          </svg>
          <!-- Spinning arc (infinite, honest loading indicator) -->
          <svg width="80" height="80" viewBox="0 0 80 80" style="display:block;position:absolute;inset:0;">
            <circle cx="40" cy="40" r="36" fill="none" stroke="hsl(84,81%,63%)" stroke-width="1.5"
              stroke-linecap="round" stroke-dasharray="80 146"
              style="transform-origin:40px 40px;animation:il-spin 1.2s linear infinite;"/>
          </svg>
          <!-- Logo: Layers icon (matches Navigation and LoadingScreen) -->
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
            <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,hsl(84,81%,63%),hsl(84,81%,50%));display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(186,234,89,0.3);">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
          </div>
        </div>
        <div style="color:white;font-family:Inter,sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.5px;margin-top:12px;">ordefy</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
